    function updateLessonBasicUrl(lessonNum, field, newUrl) {
      const lesson = lessonsData.find(l => l.num === lessonNum);
      if (lesson && ["rikai", "fukushu", "kotoba", "kanji"].includes(field)) {
        lesson[field] = newUrl.trim();
        renderSlide();
      }
    }

    function toggleAudioEditMode() {
      isEditingAudioUrls = !isEditingAudioUrls;
      renderSlide();
    }

    function updateConvAudioUrl(lessonNum, convIndex, newUrl) {
      const lesson = lessonsData.find(l => l.num === lessonNum);
      if (lesson && lesson.convs[convIndex]) {
        lesson.convs[convIndex].audio = newUrl.trim();
        renderSlide();
      }
    }

    // ==========================================
    // 3. 画面描画（ホーム ＆ 各Lessonページ）
    // ==========================================
    function renderSlide() {
      const bodyEl = document.getElementById("slideBody");
      const titleEl = document.getElementById("headerTitle");
      const backBtn = document.getElementById("backBtn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const indicator = document.getElementById("pageIndicator");

      // ページ番号と前後ボタンの状態更新
      indicator.textContent = `${currentSlideIndex + 1} / ${totalSlides}`;
      prevBtn.disabled = (currentSlideIndex === 0);
      nextBtn.disabled = (currentSlideIndex === totalSlides - 1);

      // スクロール位置をトップに戻す
      bodyEl.scrollTop = 0;

      if (currentSlideIndex === 0) {
        // 1ページ目：ホーム画面
        backBtn.classList.add("hidden");
        titleEl.textContent = "まるごとA1リンク";

        const lessonTilesHtml = lessonsData.map(lesson => `
          <button onclick="goToSlide(${lesson.num})"
            class="bg-white hover:bg-[#e8f0fe] active:scale-95 border border-slate-200 hover:border-[#1a73e8] rounded-xl py-3 px-2 text-center shadow-2xs transition cursor-pointer flex flex-col items-center justify-center">
            <span class="text-[15px] font-extrabold text-[#1a73e8]">L${lesson.num}</span>
          </button>
        `).join("");

        const kanjiTilesHtml = kanjiQuizzes.map(item => `
          <a href="${item.url}" target="_blank" rel="noopener noreferrer"
            class="bg-[#fef7e0] hover:bg-amber-100 active:scale-95 border border-amber-200 rounded-xl py-2.5 px-2 text-center text-[#b06000] font-extrabold text-sm shadow-2xs transition block">
            ${item.label}
          </a>
        `).join("");

        bodyEl.innerHTML = `
          <section class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
            <h2 class="text-sm font-bold text-slate-600 mb-3 flex items-center gap-1.5">
              <span>📖 L1～L18</span>
            </h2>
            <div class="grid grid-cols-3 gap-2.5">
              ${lessonTilesHtml}
            </div>
          </section>

          <section class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
            <h2 class="text-sm font-bold text-slate-600 mb-3 flex items-center gap-1.5">
              <span>📝 漢字クイズA1 (Google Forms)</span>
            </h2>
            <div class="grid grid-cols-4 gap-2">
              ${kanjiTilesHtml}
            </div>
          </section>

          <section class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-2xs">
            <a href="https://quizlet.com/id/645467806/%E3%81%BE%E3%82%8B%E3%81%94%E3%81%A8a1-l5l18%E3%81%8B%E3%82%93%E3%81%98-flash-cards/?i=432drq&amp;x=1jqt" target="_blank" rel="noopener noreferrer"
              class="bg-[#fef7e0] hover:bg-amber-100 active:scale-98 border border-amber-200 rounded-xl p-3 text-center text-[#b06000] font-extrabold text-sm shadow-2xs transition flex items-center justify-center gap-2">
              <span class="text-base">📇</span>
              <span>まるごとA1 L5~18「かんじ」</span>
            </a>
          </section>
        `;
      } else {
        // 2〜19ページ目：Lesson 1〜18
        const lesson = lessonsData[currentSlideIndex - 1];
        backBtn.classList.remove("hidden");
        titleEl.textContent = `Lesson ${lesson.num}`;

        // 基礎練習・漢字ボタン群（2列グリッド）
        let linkButtonsHtml = "";
        if (lesson.rikai) {
          linkButtonsHtml += `
            <a href="${escapeHtml(lesson.rikai)}" target="_blank" rel="noopener noreferrer"
              class="bg-[#e8f0fe] text-[#1967d2] hover:brightness-95 active:scale-98 rounded-xl p-3 font-bold text-[13px] sm:text-sm flex items-center gap-2 shadow-2xs transition">
              <span class="text-base shrink-0">📘</span>
              <span class="truncate">A1L${lesson.num} りかい</span>
            </a>
          `;
        }
        if (lesson.fukushu) {
          linkButtonsHtml += `
            <a href="${escapeHtml(lesson.fukushu)}" target="_blank" rel="noopener noreferrer"
              class="bg-[#e6f4ea] text-[#137333] hover:brightness-95 active:scale-98 rounded-xl p-3 font-bold text-[13px] sm:text-sm flex items-center gap-2 shadow-2xs transition">
              <span class="text-base shrink-0">📗</span>
              <span class="truncate">A1L${lesson.num} りかい復習</span>
            </a>
          `;
        }
        if (lesson.kotoba) {
          linkButtonsHtml += `
            <a href="${escapeHtml(lesson.kotoba)}" target="_blank" rel="noopener noreferrer"
              class="bg-[#f3e8fd] text-[#7627bb] hover:brightness-95 active:scale-98 rounded-xl p-3 font-bold text-[13px] sm:text-sm flex items-center gap-2 shadow-2xs transition">
              <span class="text-base shrink-0">📇</span>
              <span class="truncate">L${lesson.num} ことば</span>
            </a>
          `;
        }
        if (lesson.kanji) {
          linkButtonsHtml += `
            <a href="${escapeHtml(lesson.kanji)}" target="_blank" rel="noopener noreferrer"
              class="bg-[#fef7e0] text-[#b06000] hover:brightness-95 active:scale-98 rounded-xl p-3 font-bold text-[13px] sm:text-sm flex items-center gap-2 shadow-2xs transition">
              <span class="text-base shrink-0">📇</span>
              <span class="truncate">L${lesson.num} かんじ</span>
            </a>
          `;
        }

        const basicEditHtml = isEditingBasicUrls ? `
          <div class="mt-2.5 bg-white rounded-xl p-3 border border-slate-200/90 shadow-2xs space-y-2.5">
            <p class="text-[11px] font-bold text-slate-500">各URL（空欄にするとボタン非表示／編集後「HTML保存」で永続化）</p>
            <div>
              <label class="block text-[11px] font-bold text-[#1967d2] mb-0.5">📘 A1L${lesson.num} りかい URL</label>
              <input type="url" value="${escapeHtml(lesson.rikai || "")}"
                onchange="updateLessonBasicUrl(${lesson.num}, 'rikai', this.value)"
                placeholder="https://docs.google.com/forms/..."
                class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-[#1a73e8] focus:outline-none text-slate-700" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-[#137333] mb-0.5">📗 A1L${lesson.num} りかい復習 URL</label>
              <input type="url" value="${escapeHtml(lesson.fukushu || "")}"
                onchange="updateLessonBasicUrl(${lesson.num}, 'fukushu', this.value)"
                placeholder="https://docs.google.com/forms/..."
                class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-[#1a73e8] focus:outline-none text-slate-700" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-[#7627bb] mb-0.5">📇 L${lesson.num} ことば URL</label>
              <input type="url" value="${escapeHtml(lesson.kotoba || "")}"
                onchange="updateLessonBasicUrl(${lesson.num}, 'kotoba', this.value)"
                placeholder="https://quizlet.com/..."
                class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-[#1a73e8] focus:outline-none text-slate-700" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-[#b06000] mb-0.5">📇 L${lesson.num} かんじ URL</label>
              <input type="url" value="${escapeHtml(lesson.kanji || "")}"
                onchange="updateLessonBasicUrl(${lesson.num}, 'kanji', this.value)"
                placeholder="https://quizlet.com/..."
                class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-[#1a73e8] focus:outline-none text-slate-700" />
            </div>
          </div>
        ` : "";

        // シャドーイングセクション
        let shadowingSectionHtml = "";
        if (lesson.convs && lesson.convs.length > 0) {
          const convCardsHtml = lesson.convs.map((conv, idx) => {
            const linesHtml = conv.lines.map(line => `<p class="mb-1 last:mb-0">${escapeHtml(line)}</p>`).join("");
            const audioUrl = conv.audio ? escapeHtml(conv.audio) : "";

            const audioControlsHtml = audioUrl ? `
              <a href="${audioUrl}" target="_blank" rel="noopener noreferrer"
                class="bg-[#fef08a] hover:bg-amber-200 active:scale-95 text-[#ca8a04] font-bold text-xs px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition shrink-0 shadow-2xs">
                <i class="fa-solid fa-link text-[11px]"></i>
                <span>${conv.numLabel} 音声リンク</span>
              </a>
            ` : `
              <span class="bg-slate-100 text-slate-400 font-bold text-xs px-2.5 py-1 rounded-lg flex items-center gap-1 shrink-0">
                <i class="fa-solid fa-link-slash text-[11px]"></i>
                <span>URL未設定</span>
              </span>
            `;

            const editInputHtml = isEditingAudioUrls ? `
              <div class="mt-2.5 pt-2.5 border-t border-slate-100">
                <label class="block text-[11px] font-bold text-slate-500 mb-1">${conv.title} 音声URL</label>
                <input type="url" value="${audioUrl}"
                  onchange="updateConvAudioUrl(${lesson.num}, ${idx}, this.value)"
                  placeholder="https://marugoto.jpf.go.jp/...mp3"
                  class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-[#1a73e8] focus:outline-none text-slate-700" />
              </div>
            ` : "";

            return `
              <div class="bg-white rounded-xl p-3.5 border border-slate-200/90 shadow-2xs">
                <div class="flex items-center justify-between gap-2 pb-2 mb-2.5 border-b border-slate-100">
                  <span class="text-xs font-extrabold text-slate-700 bg-slate-100 px-2.5 py-0.5 rounded-md shrink-0">
                    ${conv.title}
                  </span>
                  ${audioControlsHtml}
                </div>
                <div class="text-[13px] sm:text-[13.5px] text-slate-800 leading-relaxed font-medium">
                  ${linesHtml}
                </div>
                ${editInputHtml}
              </div>
            `;
          }).join("");

          shadowingSectionHtml = `
            <section>
              <div class="flex items-center justify-between mb-2.5 px-0.5">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                  シャドーイング
                </h2>
                <button type="button" onclick="toggleAudioEditMode()"
                  class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${isEditingAudioUrls ? 'bg-[#1a73e8] text-white border-[#1a73e8]' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'} transition cursor-pointer">
                  ${isEditingAudioUrls ? '✓ 編集完了' : '✎ 音声URL編集'}
                </button>
              </div>
              <div class="space-y-3">
                ${convCardsHtml}
              </div>
            </section>
          `;
        }

        bodyEl.innerHTML = `
          <section>
            <div class="flex items-center justify-between mb-2.5 px-0.5">
              <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                まるごとA1
              </h2>
              <button type="button" onclick="toggleBasicEditMode()"
                class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${isEditingBasicUrls ? 'bg-[#1a73e8] text-white border-[#1a73e8]' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'} transition cursor-pointer">
                ${isEditingBasicUrls ? '✓ 編集完了' : '✎ URL編集'}
              </button>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              ${linkButtonsHtml}
            </div>
            ${basicEditHtml}
          </section>
          ${shadowingSectionHtml}
        `;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ==========================================
    // 4. スライド切り替え・キーボード操作
    // ==========================================
    function goToSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      currentSlideIndex = index;
      renderSlide();
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    document.addEventListener("keydown", (e) => {
      // 入力要素にフォーカスがある場合はスキップ
      if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowLeft") {
        prevSlide();
      } else if (e.key === "ArrowRight") {
        nextSlide();
      }
    });

    // ==========================================
    // 5. 単一HTMLファイルとしての直接ダウンロード機能
    // ==========================================
    function downloadSelfHtml() {
      try {
        // 編集中のlessonsDataもスクリプト内に反映した状態でHTMLを生成
        const docClone = document.documentElement.cloneNode(true);
        const clonedBody = docClone.querySelector("#slideBody");
        if (clonedBody) clonedBody.innerHTML = "";
        const clonedBackBtn = docClone.querySelector("#backBtn");
        if (clonedBackBtn) clonedBackBtn.classList.add("hidden");
        const clonedTitle = docClone.querySelector("#headerTitle");
        if (clonedTitle) clonedTitle.textContent = "まるごとA1リンク";
        const clonedIndicator = docClone.querySelector("#pageIndicator");
        if (clonedIndicator) clonedIndicator.textContent = "1 / 19";

        // 編集されたlessonsDataをインラインスクリプトに書き戻す
        const scripts = docClone.querySelectorAll("script");
        scripts.forEach(sc => {
          if (sc.textContent.includes("const lessonsData =")) {
            sc.textContent = sc.textContent.replace(
              /const lessonsData = \[[\s\S]*?\n    \];/,
              `const lessonsData = ${JSON.stringify(lessonsData, null, 6)};`
            );
          }
        });

        const htmlContent = "<!DOCTYPE html>\n" + docClone.outerHTML;
        const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "marugoto_a1_app.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        console.error("HTMLの保存に失敗しました:", err);
      }
    }

    // 初期表示
    window.addEventListener("DOMContentLoaded", () => {
      renderSlide();
    });
  </script>
</body>
</html>
